name: Feature request
description: An idea for OY Player
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you picture it
      description: Optional. Another player that does it well is a fine answer.
